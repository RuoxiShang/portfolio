<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Ruoxi Shang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Josefin+Sans:wght@400;600&family=Inter:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Work+Sans:wght@400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        h2 {
            font-size: 1.4em;
            margin-top: 35px;
            margin-bottom: 15px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
        }

        h3 {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 3px;
        }

        p {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 25px;
        }

        .cv-header {
            margin-bottom: 30px;
        }

        .contact-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .contact-links a {
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .contact-links a:hover {
            color: #333;
        }

        .contact-links svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* CV Entry Styling */
        .cv-entry {
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .cv-entry-main {
            flex: 1;
        }

        .cv-entry-period {
            color: #666;
            font-size: 0.9em;
            white-space: nowrap;
            text-align: right;
        }

        .cv-entry-org {
            color: #555;
            font-size: 0.95em;
        }

        .cv-entry-location {
            color: #888;
            font-size: 0.85em;
        }

        .cv-entry-details {
            margin-top: 5px;
            padding-left: 0;
            list-style: none;
        }

        .cv-entry-details li {
            color: #555;
            font-size: 0.9em;
            margin-bottom: 3px;
            padding-left: 15px;
            position: relative;
        }

        .cv-entry-details li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #999;
        }

        .cv-entry-collaborators {
            color: #666;
            font-size: 0.85em;
            font-style: italic;
            margin-top: 2px;
        }

        /* Publications in CV */
        .publication-entry {
            margin-bottom: 15px;
        }

        .pub-tags {
            margin-left: 8px;
        }

        .pub-tag {
            display: inline-block;
            background: linear-gradient(135deg, #f8e1f4 0%, #e8d5f5 100%);
            color: #8b5a8b;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.7em;
            font-weight: 500;
            margin-left: 4px;
            vertical-align: middle;
        }

        .pub-note {
            color: #888;
            font-size: 0.85em;
            margin-left: 5px;
        }

        .outcome-tag {
            color: #d946ef;
            font-style: italic;
        }

        .publication-entry .pub-title {
            font-weight: 600;
        }

        .publication-entry .pub-authors {
            color: #555;
            font-size: 0.9em;
        }

        .publication-entry .pub-venue {
            color: #666;
            font-size: 0.9em;
            font-style: italic;
        }

        /* Service entries */
        .service-entry {
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .service-entry-main {
            flex: 1;
        }

        .service-entry-period {
            color: #666;
            font-size: 0.9em;
            text-align: right;
        }

        /* Skills */
        .skills-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .skill-category {
            margin-bottom: 10px;
        }

        .skill-category h4 {
            font-size: 0.95em;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .skill-tag {
            background: #f5f5f5;
            color: #555;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        /* Awards */
        .award-entry {
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .award-entry-main {
            flex: 1;
        }

        .award-entry-year {
            color: #666;
            font-size: 0.9em;
            text-align: right;
        }

        /* Links */
        a {
            color: #666;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #333;
        }

        .back-link {
            margin-bottom: 30px;
            display: inline-block;
        }

        .link-button {
            background: none;
            color: #666;
            border: none;
            padding: 0;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            text-decoration: none;
        }

        .link-button:hover {
            color: #333;
            text-decoration: underline;
        }

        .pdf-link {
            float: right;
            font-size: 0.9em;
            color: #666;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .pdf-link:hover {
            color: #333;
        }

        .pdf-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Top Navigation */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            padding: 14px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            opacity: 0;
            transform: translateY(-100%);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .top-nav.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .top-nav-inner {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .top-nav a {
            color: #ccc;
            font-size: 0.7em;
            text-decoration: none;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.2s ease;
            position: relative;
            padding-left: 12px;
        }

        .top-nav a::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.2s ease;
        }

        .top-nav a:hover {
            color: #888;
        }

        .top-nav a:hover::before {
            background: #999;
            transform: translateY(-50%) scale(1.3);
        }

        .top-nav a.active {
            color: #666;
        }

        .top-nav a.active::before {
            background: #d946ef;
            transform: translateY(-50%) scale(1.5);
        }

        @media (max-width: 500px) {
            .top-nav-inner {
                gap: 15px;
            }
            .top-nav a {
                font-size: 0.6em;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            h1 {
                font-size: 2em;
            }

            h2 {
                font-size: 1.2em;
            }

            .cv-entry {
                grid-template-columns: 1fr;
            }

            .cv-entry-period {
                text-align: left;
                margin-top: -5px;
            }

            .service-entry,
            .award-entry {
                grid-template-columns: 1fr;
            }

            .service-entry-period,
            .award-entry-year {
                text-align: left;
            }

            .skills-section {
                grid-template-columns: 1fr;
            }

            .pdf-link {
                float: none;
                display: block;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav" id="top-nav">
        <div class="top-nav-inner">
            <a href="#education-section">Education</a>
            <a href="#experience-section">Experience</a>
            <a href="#publications-section">Publications</a>
            <a href="#skills-section">Skills</a>
        </div>
    </nav>

    <a href="index.html" class="link-button back-link">← Back to main page</a>
    <a href="pdf/cv.pdf" target="_blank" class="pdf-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 9V3.5L18.5 9H13z"/></svg>
        Download PDF
    </a>

    <div class="cv-header">
        <h1 id="cv-name">Loading...</h1>
        <div class="subtitle" id="cv-title"></div>
        <div class="contact-links" id="cv-contact"></div>
    </div>

    <section id="summary-section" style="display: none;">
        <h2>Research Summary</h2>
        <p id="cv-summary"></p>
    </section>

    <section id="education-section" style="display: none;">
        <h2>Education</h2>
        <div id="education-list"></div>
    </section>

    <section id="experience-section" style="display: none;">
        <h2>Research & Work Experience</h2>
        <div id="experience-list"></div>
    </section>

    <section id="publications-section" style="display: none;">
        <h2>Selected Publications</h2>
        <div id="cv-publications-list"></div>
        <a href="all-publications.html" class="link-button" style="margin-top: 10px; display: inline-block;">View all publications →</a>
    </section>

    <section id="service-section" style="display: none;">
        <h2>Service</h2>
        <div id="service-list"></div>
    </section>

    <section id="awards-section" style="display: none;">
        <h2>Awards & Honors</h2>
        <div id="awards-list"></div>
    </section>

    <section id="skills-section" style="display: none;">
        <h2>Skills</h2>
        <div class="skills-section" id="skills-list"></div>
    </section>

    <script>
        fetch('cv.json')
            .then(response => response.json())
            .then(data => {
                // Header
                document.getElementById('cv-name').textContent = data.name || 'CV';
                document.getElementById('cv-title').textContent = data.title || '';

                // Contact links
                const contactDiv = document.getElementById('cv-contact');
                if (data.contact) {
                    let contactHtml = '';
                    if (data.contact.email) {
                        contactHtml += `<a href="mailto:${data.contact.email}">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            ${data.contact.email}
                        </a>`;
                    }
                    if (data.contact.website) {
                        contactHtml += `<a href="${data.contact.website}" target="_blank">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                            Website
                        </a>`;
                    }
                    if (data.contact.github) {
                        contactHtml += `<a href="${data.contact.github}" target="_blank">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                            GitHub
                        </a>`;
                    }
                    if (data.contact.linkedin) {
                        contactHtml += `<a href="${data.contact.linkedin}" target="_blank">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                            LinkedIn
                        </a>`;
                    }
                    if (data.contact.scholar) {
                        contactHtml += `<a href="${data.contact.scholar}" target="_blank">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 24a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm0-24L0 9.5l4.838 3.94A8 8 0 0 1 12 9a8 8 0 0 1 7.162 4.44L24 9.5z"/></svg>
                            Scholar
                        </a>`;
                    }
                    if (data.contact.location) {
                        contactHtml += `<span style="color: #666; font-size: 0.9em;">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;vertical-align:middle;margin-right:3px;"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                            ${data.contact.location}
                        </span>`;
                    }
                    contactDiv.innerHTML = contactHtml;
                }

                // Research Summary
                if (data.summary) {
                    document.getElementById('summary-section').style.display = 'block';
                    // Convert **bold** to <strong>
                    let summaryHtml = data.summary.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
                    document.getElementById('cv-summary').innerHTML = summaryHtml;
                }

                // Education
                if (data.education && data.education.length > 0) {
                    document.getElementById('education-section').style.display = 'block';
                    const eduList = document.getElementById('education-list');
                    eduList.innerHTML = data.education.map(edu => `
                        <div class="cv-entry">
                            <div class="cv-entry-main">
                                <h3>${edu.degree}</h3>
                                <div class="cv-entry-org">${edu.institution}</div>
                                ${edu.location ? `<div class="cv-entry-location">${edu.location}</div>` : ''}
                                ${edu.details && edu.details.length > 0 ? `
                                    <ul class="cv-entry-details">
                                        ${edu.details.map(d => `<li>${d}</li>`).join('')}
                                    </ul>
                                ` : ''}
                            </div>
                            <div class="cv-entry-period">${edu.period || ''}</div>
                        </div>
                    `).join('');
                }

                // Experience
                if (data.experience && data.experience.length > 0) {
                    document.getElementById('experience-section').style.display = 'block';
                    const expList = document.getElementById('experience-list');
                    
                    // Function to style outcome phrases as tags
                    function styleOutcomes(text) {
                        // Match patterns like "Co-authored paper accepted to X" or "Paper and Patent currently under review"
                        return text
                            .replace(/(Co-authored paper accepted to [A-Z0-9]+ \d{4}\.?)/g, '<span class="outcome-tag">$1</span>')
                            .replace(/(Paper and Patent currently under review\.?)/g, '<span class="outcome-tag">$1</span>')
                            .replace(/(Paper currently under review\.?)/g, '<span class="outcome-tag">$1</span>');
                    }
                    
                    expList.innerHTML = data.experience.map(exp => `
                        <div class="cv-entry">
                            <div class="cv-entry-main">
                                <h3>${exp.title}</h3>
                                <div class="cv-entry-org">${exp.organization}${exp.location ? `, ${exp.location}` : ''}</div>
                                ${exp.collaborators ? `<div class="cv-entry-collaborators">Collaborators: ${exp.collaborators}</div>` : ''}
                                ${exp.details && exp.details.length > 0 ? `
                                    <ul class="cv-entry-details">
                                        ${exp.details.map(d => `<li>${styleOutcomes(d)}</li>`).join('')}
                                    </ul>
                                ` : ''}
                            </div>
                            <div class="cv-entry-period">${exp.period || ''}</div>
                        </div>
                    `).join('');
                }

                // Publications
                if (data.publications && data.publications.length > 0) {
                    document.getElementById('publications-section').style.display = 'block';
                    const pubList = document.getElementById('cv-publications-list');
                    pubList.innerHTML = data.publications.map(pub => {
                        // Bold "Ruoxi Shang" in authors
                        let authors = pub.authors;
                        if (authors) {
                            authors = authors.replace(/Ruoxi Shang/g, '<strong>Ruoxi Shang</strong>');
                        }
                        // Generate tags HTML
                        let tagsHtml = '';
                        if (pub.tags && pub.tags.length > 0) {
                            tagsHtml = pub.tags.map(tag => `<span class="pub-tag">${tag}</span>`).join('');
                        }
                        // Note for equal contributions etc.
                        let noteHtml = pub.note ? `<span class="pub-note">${pub.note}</span>` : '';
                        return `
                            <div class="publication-entry">
                                <div class="pub-title">${pub.title}${tagsHtml ? `<span class="pub-tags">${tagsHtml}</span>` : ''}</div>
                                <div class="pub-authors">${authors}${noteHtml}</div>
                                <div class="pub-venue">${pub.venue}</div>
                            </div>
                        `;
                    }).join('');
                }

                // Service
                if (data.service && data.service.length > 0) {
                    document.getElementById('service-section').style.display = 'block';
                    const serviceList = document.getElementById('service-list');
                    serviceList.innerHTML = data.service.map(s => `
                        <div class="service-entry">
                            <div class="service-entry-main">
                                <strong>${s.role}</strong> — ${s.venue}
                            </div>
                            <div class="service-entry-period">${s.period || ''}</div>
                        </div>
                    `).join('');
                }

                // Awards
                if (data.awards && data.awards.length > 0) {
                    document.getElementById('awards-section').style.display = 'block';
                    const awardsList = document.getElementById('awards-list');
                    awardsList.innerHTML = data.awards.map(a => `
                        <div class="award-entry">
                            <div class="award-entry-main">
                                <strong>${a.title}</strong>${a.venue ? ` — ${a.venue}` : ''}
                            </div>
                            <div class="award-entry-year">${a.year || ''}</div>
                        </div>
                    `).join('');
                }

                // Skills
                if (data.skills && Object.keys(data.skills).length > 0) {
                    document.getElementById('skills-section').style.display = 'block';
                    const skillsList = document.getElementById('skills-list');
                    skillsList.innerHTML = Object.entries(data.skills).map(([category, skills]) => `
                        <div class="skill-category">
                            <h4>${category}</h4>
                            <div class="skill-tags">
                                ${skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                            </div>
                        </div>
                    `).join('');
                }
            })
            .catch(error => {
                console.error('Error loading CV:', error);
                document.getElementById('cv-name').textContent = 'Error loading CV';
            });

        // Top navigation scroll spy and visibility
        const sections = ['education-section', 'experience-section', 'publications-section', 'skills-section'];
        const navLinks = document.querySelectorAll('.top-nav a');
        const topNav = document.getElementById('top-nav');

        function updateNav() {
            const scrollPos = window.scrollY + window.innerHeight / 3;
            
            // Show/hide top nav based on scroll position
            if (window.scrollY > 200) {
                topNav.classList.add('visible');
            } else {
                topNav.classList.remove('visible');
            }
            
            // Check if we're at the bottom of the page
            const isAtBottom = (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50;
            
            // Update active section
            let currentSection = '';
            if (isAtBottom) {
                currentSection = sections[sections.length - 1];
            } else {
                sections.forEach(sectionId => {
                    const section = document.getElementById(sectionId);
                    if (section && section.offsetTop <= scrollPos) {
                        currentSection = sectionId;
                    }
                });
            }

            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === '#' + currentSection) {
                    link.classList.add('active');
                }
            });
        }

        window.addEventListener('scroll', updateNav);
        window.addEventListener('load', updateNav);

        // Smooth scroll for nav links
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetId = link.getAttribute('href').substring(1);
                const target = document.getElementById(targetId);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
</body>
</html>
