<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | Ruoxi Shang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body.cv-page main {
            margin: 0 auto;
            max-width: 760px;
            padding: 56px 32px 96px;
        }

        .cv-header {
            margin-bottom: 4px;
        }

        .cv-header h1 {
            margin-bottom: 8px;
        }

        .cv-subtitle {
            color: var(--color-muted);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .cv-entry {
            display: grid;
            gap: 24px;
            grid-template-columns: minmax(0, 1fr) auto;
            margin-bottom: 26px;
        }

        .cv-entry:last-child {
            margin-bottom: 0;
        }

        .cv-entry-period {
            align-self: start;
            color: var(--color-quiet);
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            padding-top: 3px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .cv-entry-role {
            color: var(--color-text);
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.35;
        }

        .cv-entry-org {
            color: var(--color-muted);
            font-size: 0.93rem;
            line-height: 1.45;
            margin-top: 2px;
        }

        .cv-entry-collab {
            color: var(--color-quiet);
            font-size: 0.86rem;
            font-style: italic;
            margin-top: 2px;
        }

        .cv-entry-details {
            list-style: none;
            margin: 9px 0 0;
            padding: 0;
        }

        .cv-entry-details li {
            color: #3a3a3a;
            font-size: 0.92rem;
            line-height: 1.55;
            margin-bottom: 5px;
            padding-left: 16px;
            position: relative;
        }

        .cv-entry-details li::before {
            color: var(--color-quiet);
            content: "•";
            left: 2px;
            position: absolute;
        }

        .cv-entry-details em {
            color: var(--color-quiet);
            font-style: italic;
        }

        .cv-entry-details strong {
            color: var(--color-text);
            font-weight: 600;
        }

        .cv-skill-row {
            display: grid;
            gap: 24px;
            grid-template-columns: 180px minmax(0, 1fr);
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--color-rule);
        }

        .cv-skill-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .cv-skill-cat {
            color: var(--color-text);
            font-size: 0.86rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .cv-skill-list {
            color: var(--color-muted);
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .cv-publication {
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .cv-publication:last-child {
            margin-bottom: 0;
        }

        .cv-pub-title {
            color: var(--color-text);
            font-weight: 600;
        }

        .cv-pub-authors {
            color: var(--color-muted);
        }

        .cv-pub-authors strong {
            color: var(--color-text);
            font-weight: 600;
        }

        .cv-pub-venue {
            color: var(--color-quiet);
            font-style: italic;
        }

        .cv-pub-note {
            color: var(--color-quiet);
            font-size: 0.84rem;
            margin-left: 2px;
        }

        .cv-pub-links {
            color: var(--color-quiet);
            font-size: 0.84rem;
            white-space: nowrap;
        }

        .cv-pub-links a {
            color: var(--color-text);
        }

        @media (max-width: 600px) {
            body.cv-page main {
                padding: 40px 20px 72px;
            }

            .cv-entry {
                gap: 4px;
                grid-template-columns: 1fr;
            }

            .cv-entry-period {
                order: -1;
                padding-top: 0;
            }

            .cv-skill-row {
                gap: 4px;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="cv-page">
    <main>
        <a href="index.html" class="back-link">← Back</a>

        <header class="cv-header">
            <h1 id="cv-name">Loading…</h1>
            <p class="cv-subtitle" id="cv-subtitle"></p>
            <p class="meta-line" id="cv-contact"></p>
            <p class="meta-line" id="cv-pdf-line">
                <a href="pdf/cv.pdf" target="_blank" rel="noopener noreferrer" class="meta-link">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 9V3.5L18.5 9H13z"/>
                    </svg>
                    <span class="meta-text">Download PDF</span>
                </a>
            </p>
        </header>

        <section>
            <h2>Education</h2>
            <div id="education-list"></div>
        </section>

        <section>
            <h2>Technical Skills</h2>
            <div id="skills-list"></div>
        </section>

        <section>
            <h2>Selected Research Experience</h2>
            <div id="experience-list"></div>
        </section>

        <section>
            <h2>Social Impact &amp; Mentorship</h2>
            <div id="impact-list"></div>
        </section>

        <section>
            <h2>Selected Publications</h2>
            <div id="publications-list"></div>
            <a href="all-publications.html" class="section-action">All publications →</a>
        </section>
    </main>

    <script>
        const ICONS = {
            email: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>',
            github: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>',
            linkedin: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>',
            scholar: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 24a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm0-24L0 9.5l4.838 3.94A8 8 0 0 1 12 9a8 8 0 0 1 7.162 4.44L24 9.5z"/></svg>',
            location: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>'
        };

        function md(text) {
            if (!text) return '';
            return text
                .replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/_([^_]+)_/g, '<em>$1</em>');
        }

        function renderEducation(items) {
            return items.map((edu) => `
                <div class="cv-entry">
                    <div>
                        <div class="cv-entry-role">${edu.degree}</div>
                        <div class="cv-entry-org">${edu.institution}</div>
                        ${edu.details && edu.details.length ? `
                            <ul class="cv-entry-details">
                                ${edu.details.map((d) => `<li>${md(d)}</li>`).join('')}
                            </ul>` : ''}
                    </div>
                    <div class="cv-entry-period">${edu.period || ''}</div>
                </div>
            `).join('');
        }

        function renderSkills(skills) {
            return Object.entries(skills).map(([category, items]) => `
                <div class="cv-skill-row">
                    <div class="cv-skill-cat">${category}</div>
                    <div class="cv-skill-list">${items.join(', ')}</div>
                </div>
            `).join('');
        }

        function renderExperience(items) {
            return items.map((exp) => `
                <div class="cv-entry">
                    <div>
                        <div class="cv-entry-role">${exp.title}</div>
                        <div class="cv-entry-org">${exp.organization}${exp.location ? `, ${exp.location}` : ''}</div>
                        ${exp.collaborators ? `<div class="cv-entry-collab">Advisors: ${exp.collaborators}</div>` : ''}
                        ${exp.details && exp.details.length ? `
                            <ul class="cv-entry-details">
                                ${exp.details.map((d) => `<li>${md(d)}</li>`).join('')}
                            </ul>` : ''}
                    </div>
                    <div class="cv-entry-period">${exp.period || ''}</div>
                </div>
            `).join('');
        }

        function renderImpact(items) {
            return items.map((item) => `
                <div class="cv-entry">
                    <div>
                        <div class="cv-entry-role">${item.title}</div>
                        <div class="cv-entry-org">${item.organization}</div>
                        ${item.details && item.details.length ? `
                            <ul class="cv-entry-details">
                                ${item.details.map((d) => `<li>${md(d)}</li>`).join('')}
                            </ul>` : ''}
                    </div>
                    <div class="cv-entry-period">${item.period || ''}</div>
                </div>
            `).join('');
        }

        function renderPublications(items) {
            return items.map((pub) => {
                const authors = (pub.authors || '').replace(/Ruoxi Shang/g, '<strong>Ruoxi Shang</strong>');
                const note = pub.note ? `<span class="cv-pub-note">[${pub.note}]</span>` : '';
                const links = [];
                if (pub.arxiv) links.push(`<a href="${pub.arxiv}" target="_blank" rel="noopener noreferrer">arXiv</a>`);
                if (pub.pdf) links.push(`<a href="pdf/${pub.pdf}" target="_blank" rel="noopener noreferrer">PDF</a>`);
                if (pub.doi) links.push(`<a href="${pub.doi}" target="_blank" rel="noopener noreferrer">DOI</a>`);
                const linksHtml = links.length ? ` <span class="cv-pub-links">[${links.join(' · ')}]</span>` : '';
                return `
                    <div class="cv-publication">
                        <span class="cv-pub-title">${pub.title}.</span>
                        <span class="cv-pub-authors">${authors}.</span>
                        <span class="cv-pub-venue">${pub.venue}.</span>
                        ${note}${linksHtml}
                    </div>
                `;
            }).join('');
        }

        function renderContact(contact) {
            const parts = [];
            if (contact.email) {
                parts.push(`<a href="mailto:${contact.email}" class="meta-link">${ICONS.email}<span class="meta-text">${contact.email}</span></a>`);
            }
            if (contact.github) {
                parts.push(`<a href="${contact.github}" target="_blank" rel="noopener noreferrer" class="meta-link">${ICONS.github}<span class="meta-text">GitHub</span></a>`);
            }
            if (contact.linkedin) {
                parts.push(`<a href="${contact.linkedin}" target="_blank" rel="noopener noreferrer" class="meta-link">${ICONS.linkedin}<span class="meta-text">LinkedIn</span></a>`);
            }
            if (contact.scholar) {
                parts.push(`<a href="${contact.scholar}" target="_blank" rel="noopener noreferrer" class="meta-link">${ICONS.scholar}<span class="meta-text">Scholar</span></a>`);
            }
            return parts.join('<span class="meta-sep">·</span>');
        }

        fetch('cv.json')
            .then((response) => response.json())
            .then((data) => {
                document.getElementById('cv-name').textContent = data.name || 'CV';
                document.getElementById('cv-subtitle').textContent = data.title || '';
                document.getElementById('cv-contact').innerHTML = renderContact(data.contact || {});

                if (data.education && data.education.length) {
                    document.getElementById('education-list').innerHTML = renderEducation(data.education);
                }
                if (data.skills && Object.keys(data.skills).length) {
                    document.getElementById('skills-list').innerHTML = renderSkills(data.skills);
                }
                if (data.experience && data.experience.length) {
                    document.getElementById('experience-list').innerHTML = renderExperience(data.experience);
                }
                if (data.impact && data.impact.length) {
                    document.getElementById('impact-list').innerHTML = renderImpact(data.impact);
                }
                if (data.publications && data.publications.length) {
                    document.getElementById('publications-list').innerHTML = renderPublications(data.publications);
                }
            })
            .catch((error) => {
                console.error('Error loading CV:', error);
                document.getElementById('cv-name').textContent = 'Error loading CV';
            });
    </script>
</body>
</html>
